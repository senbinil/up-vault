name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Test
        run: make test

  migration:
    name: Migration check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: up_vault
          POSTGRES_PASSWORD: up_vault
          POSTGRES_DB: up_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U up_vault -d up_vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://up_vault:up_vault@localhost:5432/up_vault
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Check migrations match models
        run: make check-migration
